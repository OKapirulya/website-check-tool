apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-drift-scan
  namespace: website-check-tool
spec:
  schedule: "0 6 * * 1"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scan
              image: curlimages/curl:8.11.1
              args:
                - -sf
                - "http://api.website-check-tool.svc.cluster.local/check?url=https://olegkapy.com"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "50m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
